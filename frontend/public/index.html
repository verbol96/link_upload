<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Цвет адресной строки браузера на мобилке — цвет твоей шапки -->
    <meta name="theme-color" content="#116466" />

    <meta
      name="description"
      content="Сервис для заказа фотографий LINK — печать, редактор, доставка"
    />

    <!-- Отключение автоперевода страницы -->
    <meta name="google" content="notranslate">
    <meta name="robots" content="notranslate">
    <meta name="slurp" content="noydir">
    <meta http-equiv="Content-Language" content="ru">

    <!-- Bootstrap CSS и иконки (локальные) -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/fonts/bootstrap-icons.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/image/icon.PNG" />
    <link rel="shortcut icon" type="image/png" href="/static/image/icon.PNG"   />
    <link rel="apple-touch-icon" href="/static/image/iconApple.PNG" />
    

    <!-- Заголовок по умолчанию. Меняется динамически из React -->
    <title>Фотоцентр LINK</title>
  </head>
  <body translate="no">
    <noscript>
      Для работы сайта необходим JavaScript. Включите его в настройках браузера.
    </noscript>

    <div id="root"></div>

    <!-- Блокировка автоперевода -->
    <script>
      document.documentElement.setAttribute('translate', 'no');
      document.documentElement.setAttribute('lang', 'ru');
      document.body.setAttribute('translate', 'no');

      if (window.chrome && chrome.runtime) {
        try {
          chrome.runtime.sendMessage({ type: 'DISABLE_TRANSLATE' });
        } catch (e) {}
      }

      const observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          if (mutation.type === 'attributes' &&
              mutation.attributeName === 'translated') {
            document.documentElement.removeAttribute('translated');
          }
        });
      });

      observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['translated', 'class']
      });
    </script>
  </body>
</html>
